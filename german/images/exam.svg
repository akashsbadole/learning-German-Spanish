<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#ffffff"/>
  <rect y="460" width="800" height="140" fill="#D7CCC8"/>

  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#37474F">Die Prüfung</text>
  <text x="400" y="72" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#78909C">परीक्षा | परीक्षा</text>

  <rect x="300" y="90" width="200" height="60" rx="30" fill="#FFC107"/>
  <text x="400" y="128" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#37474F">A1 · A2</text>

  <circle cx="130" cy="300" r="55" fill="#BBDEFB"/>
  <circle cx="130" cy="300" r="42" fill="#FFFFFF"/>
  <line x1="130" y1="300" x2="130" y2="272" stroke="#1565C0" stroke-width="4"/>
  <line x1="130" y1="300" x2="150" y2="310" stroke="#1565C0" stroke-width="4"/>
  <text x="130" y="378" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#37474F">die Uhr</text>
  <text x="130" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#78909C">घड्याळ | घड़ी</text>

  <rect x="280" y="160" width="240" height="60" rx="8" fill="#EF5350"/>
  <text x="400" y="198" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Prüfung startet!</text>

  <rect x="240" y="240" width="320" height="200" rx="10" fill="#ECEFF1"/>
  <rect x="255" y="255" width="290" height="170" rx="6" fill="#FFFFFF"/>
  <text x="400" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#37474F">Name: ______</text>
  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#37474F">1. ______</text>
  <text x="400" y="370" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#37474F">2. ______</text>
  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#37474F">3. ______</text>

  <line x1="230" y1="450" x2="570" y2="450" stroke="#90A4AE" stroke-width="2" stroke-dasharray="8 6"/>
  <g font-family="sans-serif" font-size="16" fill="#37474F" text-anchor="middle">
    <text x="260" y="430">1. Hören</text>
    <text x="330" y="430">2. Lesen</text>
    <text x="415" y="430">3. Schreiben</text>
    <text x="520" y="430">4. Sprechen</text>
  </g>

  <polygon points="660,250 730,250 745,270 730,290 660,290 645,270" fill="#26A69A"/>
  <text x="697" y="278" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">80</text>
  <text x="697" y="320" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#37474F">60%</text>
  <text x="697" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#78909C">bestehen</text>

  <rect x="590" y="380" width="190" height="40" rx="8" fill="#8BC34A"/>
  <text x="685" y="406" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Viel Erfolg!</text>

  <g font-family="sans-serif" font-size="16" fill="#37474F" text-anchor="middle">
    <text x="400" y="505">परीक्षेची तयारी करा!</text>
    <text x="400" y="530" fill="#78909C">Goethe-Zertifikat A1 · A2 — शुभकामनाएँ!</text>
  </g>
