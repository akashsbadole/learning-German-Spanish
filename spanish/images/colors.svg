      <text x="115" y="395" font-size="18" fill="#FFF3E0">नारंगी</text>
    </g>
    <g>
      <rect x="220" y="290" width="170" height="150" rx="14" fill="#EC407A"/>
      <text x="305" y="365" font-size="26" font-weight="bold" fill="#FFFFFF">rosa</text>
      <text x="305" y="395" font-size="18" fill="#FCE4EC">गुलाबी</text>
    </g>
    <g>
