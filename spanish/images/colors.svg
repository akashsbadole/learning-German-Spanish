<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#37474F">Los Colores</text>
  <text x="400" y="76" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#78909C">रंग | रंग</text>

  <g font-family="sans-serif" text-anchor="middle">
    <g>
      <rect x="30" y="110" width="170" height="150" rx="14" fill="#E53935"/>
      <text x="115" y="185" font-size="26" font-weight="bold" fill="#FFFFFF">rojo</text>
      <text x="115" y="215" font-size="18" fill="#FFEBEE">लाल</text>
    </g>
    <g>
      <rect x="220" y="110" width="170" height="150" rx="14" fill="#1E88E5"/>
      <text x="305" y="185" font-size="26" font-weight="bold" fill="#FFFFFF">azul</text>
      <text x="305" y="215" font-size="18" fill="#E3F2FD">नीला</text>
    </g>
    <g>
      <rect x="410" y="110" width="170" height="150" rx="14" fill="#43A047"/>
